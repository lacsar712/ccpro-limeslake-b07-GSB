services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: limeslake
      POSTGRES_USER: limeslake
      POSTGRES_PASSWORD: limeslake
    ports:
      - "6470:5432"
    volumes:
      - limeslake_5070_6470_pg:/var/lib/postgresql/data
    # 首次 initdb 时频繁 healthcheck 会卡住临时库关停，故改为仅等容器启动
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U limeslake -d limeslake"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 30
    #   start_period: 40s

  web:
    build: .
    environment:
      SECRET_KEY: limeslake-dev-secret
      DATABASE_URL: postgresql+psycopg2://limeslake:limeslake@db:5432/limeslake
    ports:
      - "5470:8000"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  limeslake_5070_6470_pg: